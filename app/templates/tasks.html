{% extends "base.html" %}
{% block title %}Tasks{% endblock %}

{% block content %}
<div class="task-box">
    <h2>Your Tasks</h2>

    <!-- Add Task -->
    <form action="{{ url_for('tasks.add_task') }}" method="POST" class="task-form">
        <input type="text" name="title" placeholder="Enter a new task" value="{{ request.form.title or '' }}" required>
        <button type="submit" class="btn">Add</button>
    </form>

    {% if tasks %}
        <!-- Clear All Tasks -->
        <form method="POST" action="{{ url_for('tasks.clear_tasks') }}">
            <button type="submit" class="btn btn-clear">Clear All Tasks</button>
        </form>
        <br>

        <table class="task-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Task</th>
                    <th>Status</th>
                    <th>Change</th>
                </tr>
            </thead>
            <tbody>
                {% for task in tasks %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ task.title }}</td>
                    <td>
                        <span class="badge {{ task.status|lower }}">
                            {{ task.status }}
                        </span>
                    </td>
                    <td>
                        <form action="{{ url_for('tasks.toggle_status', task_id=task.id) }}" method="POST" style="display:inline">
                            <button class="btn-small" type="submit">Next</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No tasks yet. Add one above!</p>
    {% endif %}
</div>
{% endblock %}
